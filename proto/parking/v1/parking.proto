syntax = "proto3";

package parking.v1;

option go_package = "github.com/nalrematvonesah/parking.proto/gen/parking/v1;parkingv1";

// ParkingService manages parking slots and their availability.
service ParkingService {
  // AssignSlot reserves a free slot and marks it occupied.
  rpc AssignSlot(AssignSlotRequest) returns (AssignSlotResponse);
  // ReleaseSlot frees a previously occupied slot.
  rpc ReleaseSlot(ReleaseSlotRequest) returns (Empty);
  // GetAvailableSlots returns the number of free slots.
  rpc GetAvailableSlots(Empty) returns (AvailableSlotsResponse);
}

message AssignSlotRequest {
  // Optional idempotency key from the caller (e.g. session service).
  string request_id = 1;
}

message AssignSlotResponse {
  int64 slot_id = 1;
}

message ReleaseSlotRequest {
  int64 slot_id = 1;
}

message AvailableSlotsResponse {
  int32 count = 1;
}

message Empty {}
